<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neon Junction Drive</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="shell">
      <canvas id="game" aria-label="Third-person city driving game"></canvas>
      <section class="hud" aria-label="Game status">
        <div><span>Speed</span><strong><b id="speed">0</b> mph</strong></div>
        <div><span>Drop</span><strong><b id="route">0</b>/8</strong></div>
        <div><span>Damage</span><strong id="damage">0%</strong></div>
      </section>
      <div class="hint">WASD / arrows move · Space handbrake · Shift boost · E enter/exit car · R reset</div>
    </main>

    <script type="module" src="/game.js"></script>
  </body>
</html>
