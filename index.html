<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neon Junction Drive</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <section class="hud" aria-label="Game status">
        <div>
          <span class="label">district</span>
          <strong id="district">Downtown Loop</strong>
        </div>
        <div>
          <span class="label">speed</span>
          <strong><span id="speed">0</span> mph</strong>
        </div>
        <div>
          <span class="label">checkpoints</span>
          <strong><span id="score">0</span>/<span id="target">8</span></strong>
        </div>
        <div>
          <span class="label">best chain</span>
          <strong id="chain">0</strong>
        </div>
      </section>

      <canvas id="game" width="1280" height="720" aria-label="Top-down retro city driving game"></canvas>

      <section class="controls" aria-label="Touch controls">
        <button class="control control-up" data-key="w" aria-label="Accelerate">^</button>
        <button class="control control-left" data-key="a" aria-label="Steer left">&lt;</button>
        <button class="control control-down" data-key="s" aria-label="Reverse">v</button>
        <button class="control control-right" data-key="d" aria-label="Steer right">&gt;</button>
        <button class="control control-brake" data-key=" " aria-label="Handbrake">!</button>
        <button class="control control-reset" data-reset aria-label="Reset">R</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
